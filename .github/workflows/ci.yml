name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:run
      # Prove the published artifact actually runs: the bin entry must exist
      # and be executable on a clean checkout.
      - run: npm run build
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help

  pack:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # `npm pack` is the real install: it must contain the bin, the types and
      # the agent skill, and must not ship the sources.
      - run: npm pack --dry-run
      - name: Assert the published contents
        run: |
          set -euo pipefail
          files=$(npm pack --dry-run --json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);console.log(j[0].files.map(f=>f.path).join('\n'))
            })
          ")
          echo "$files" | grep -qx 'dist/cli.js'      || { echo 'dist/cli.js missing'; exit 1; }
          echo "$files" | grep -qx 'dist/index.d.ts' || { echo 'types missing'; exit 1; }
          echo "$files" | grep -qx 'skill/SKILL.md'   || { echo 'skill missing'; exit 1; }
          echo "$files" | grep -qx 'AGENTS.md'       || { echo 'AGENTS.md missing'; exit 1; }
          echo "$files" | grep -qx 'LICENSE'         || { echo 'LICENSE missing'; exit 1; }
          if echo "$files" | grep -q '^src/'; then
            echo 'sources should not be published'; exit 1
          fi
          echo "package contents OK"
