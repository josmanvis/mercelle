name: Release

# Publishing is manual and gated: a tag is the only thing that can publish.
# This keeps an accidental push to main from shipping to npm.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:run
      - run: npm run build

      - name: Make sure the tag and package.json agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          actual=$(node -p "require('./package.json').version")
          if [ "$tag" != "$actual" ]; then
            echo "tag $tag does not match package.json $actual"
            exit 1
          fi

      - name: Publish only if this version is not already on npm
        # Uses npm Trusted Publishing (OIDC): GitHub exchanges a short-lived
        # token for a publish grant, so there is no long-lived secret in the
        # repo at all. See docs/releasing.md for the one-time npm setup.
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "mercelle@$version" version >/dev/null 2>&1; then
            echo "mercelle@$version is already published — nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
        # NODE_AUTH_TOKEN is intentionally unset: Trusted Publishing
        # authenticates via OIDC. If you would rather use a token, set the
        # NPM_TOKEN secret and uncomment the env block below.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
